<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Dostoevsky Writing</title>
  <desc id="desc">An original stylized illustration of Dostoevsky writing at a desk.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#11131a"/>
      <stop offset="60%" stop-color="#171821"/>
      <stop offset="100%" stop-color="#1e1812"/>
    </linearGradient>
    <radialGradient id="lamp" cx="62%" cy="26%" r="28%">
      <stop offset="0%" stop-color="#ffdca2" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#c58a43" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b2718"/>
      <stop offset="100%" stop-color="#5a3920"/>
    </linearGradient>
    <linearGradient id="coat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d3038"/>
      <stop offset="100%" stop-color="#1b1d23"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2c5a3"/>
      <stop offset="100%" stop-color="#c79e79"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="1400" height="900" fill="url(#bg)"/>
  <ellipse cx="860" cy="260" rx="430" ry="250" fill="url(#lamp)"/>

